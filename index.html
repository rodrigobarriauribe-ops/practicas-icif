<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prácticas ICIF</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 34 34%22%3E%3Crect width=%2234%22 height=%2234%22 rx=%228%22 fill=%22%230a6a85%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: barra de perfiles arriba; cada perfil abre con su resumen y luego lista + detalle. */
  --bg:#f2f5f7;
  --surface:#ffffff;
  --surface-2:#f7f9fa;
  --ink:#13212e;
  --muted:#556574;
  --line:#dbe2e8;
  --accent:#0a6a85;
  --accent-ink:#ffffff;
  --accent-soft:#e0eff4;
  --ok:#1b7045; --ok-soft:#e0f1e7;
  --warn:#975400; --warn-soft:#fbeed6;
  --crit:#b3261e; --crit-soft:#fbe5e2;
  --info:#3a55a0; --info-soft:#e5eaf7;
  --font-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:10px;
  --shadow:0 1px 2px rgba(19,33,46,.06),0 4px 16px rgba(19,33,46,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d141b; --surface:#141e28; --surface-2:#18242f; --ink:#e4ecf2; --muted:#98a9b8; --line:#26364a;
    --accent:#56b6d2; --accent-ink:#04202a; --accent-soft:#143440;
    --ok:#62c792; --ok-soft:#14301f; --warn:#e3a957; --warn-soft:#33260e; --crit:#f2867a; --crit-soft:#3b1815; --info:#93acef; --info-soft:#1a2443;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d141b; --surface:#141e28; --surface-2:#18242f; --ink:#e4ecf2; --muted:#98a9b8; --line:#26364a;
  --accent:#56b6d2; --accent-ink:#04202a; --accent-soft:#143440;
  --ok:#62c792; --ok-soft:#14301f; --warn:#e3a957; --warn-soft:#33260e; --crit:#f2867a; --crit-soft:#3b1815; --info:#93acef; --info-soft:#1a2443;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-size:1.45rem}
h3{font-size:1.12rem}
h4{font-size:.98rem}
p{margin:0}
small{font-size:.82rem}
.mono{font-family:var(--font-mono);font-size:.88em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ——— Barra superior ——— */
.appbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px max(16px,calc((100% - 1280px)/2));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:1.15rem;line-height:1.1}
.brand-sub{font-size:.78rem;color:var(--muted)}
.roles{display:flex;flex-wrap:wrap;gap:4px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;margin-left:auto}
.roles button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:500;font-size:.9rem;color:var(--muted)}
.roles button:hover{color:var(--ink)}
.roles button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.whoami{display:flex;align-items:center;gap:8px;font-size:.88rem}
.whoami label{color:var(--muted)}
.whoami select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:260px}
.proto-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:7px max(16px,calc((100% - 1280px)/2));font-size:.82rem;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;font-size:inherit}

.whoami{margin-left:auto}
.who-n{display:grid;line-height:1.2;text-align:right}
.login-card{max-width:540px;width:100%;margin:40px auto}
main{max-width:1280px;margin:0 auto;padding:22px 16px 64px;display:grid;gap:22px}
main > *,.card > *,.detail > *,.split > *,.two > *,.drawer-body > *{min-width:0}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.page-head p{color:var(--muted);max-width:68ch}
.eyebrow{font-size:.76rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ——— Piezas ——— */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:grid;gap:14px;align-content:start}
.card-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:.9rem;line-height:1.2;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.small{padding:5px 10px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap;border:1px solid transparent}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.plain::before{display:none}
.tone-neutral{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.tone-accent{background:var(--accent-soft);color:var(--accent)}
.tone-ok{background:var(--ok-soft);color:var(--ok)}
.tone-warn{background:var(--warn-soft);color:var(--warn)}
.tone-crit{background:var(--crit-soft);color:var(--crit)}
.tone-info{background:var(--info-soft);color:var(--info)}
.tag{font-family:var(--font-mono);font-size:.76rem;padding:1px 7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.empty{color:var(--muted);font-style:italic;padding:8px 0}
.note{font-size:.86rem;color:var(--muted)}
.callout{display:grid;gap:4px;padding:10px 14px;border-radius:8px;border-left:4px solid currentColor;font-size:.9rem}
.callout strong{color:var(--ink)}
.callout p{color:var(--ink)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;gap:2px}
.kpi .k-label{font-size:.8rem;color:var(--muted);font-weight:500}
.kpi .k-val{font-family:var(--font-display);font-size:2rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .k-sub{font-size:.78rem;color:var(--muted)}
.kpi.flag{border-top:3px solid var(--warn)}
.kpi.flag-crit{border-top:3px solid var(--crit)}

/* Embudo por etapa */
.pipeline{display:flex;flex-wrap:wrap;gap:6px}
.pipe-step{flex:1 1 110px;display:grid;gap:4px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.pipe-step:hover{border-color:var(--accent)}
.pipe-step[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pipe-step .p-n{font-family:var(--font-display);font-size:1.4rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.pipe-step .p-l{font-size:.76rem;color:var(--muted);line-height:1.25}
.pipe-step .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.pipe-step .bar i{display:block;height:100%;background:var(--accent)}

/* Alertas */
.alerts{display:grid;gap:6px}
.alert-row{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:9px 12px 9px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.alert-row:hover{border-color:var(--muted)}
.alert-row .stripe{align-self:stretch;border-radius:8px 0 0 8px}
.alert-row .a-who{font-weight:600}
.alert-row .a-txt{font-size:.88rem;color:var(--muted)}
.sev-crit .stripe{background:var(--crit)}
.sev-warn .stripe{background:var(--warn)}
.sev-info .stripe{background:var(--info)}

/* Tabla */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.toolbar input[type="search"]{flex:1 1 220px;min-width:0}
.table-wrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table.grid{width:100%;border-collapse:collapse;font-size:.9rem}
table.grid th,table.grid td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.grid thead th{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover{background:var(--surface-2)}
table.grid tbody tr:last-child td{border-bottom:0}
.rowbtn{border:0;background:none;padding:0;font-weight:600;cursor:pointer;text-align:left;color:var(--ink)}
.rowbtn:hover{color:var(--accent)}
.notes3{display:flex;gap:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.notes3 span{display:grid;line-height:1.15}
.notes3 small{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.notes3 b{font-weight:600}
.n-red{color:var(--crit)}
.alert-dot{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;font-size:.78rem;font-weight:700}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* Diseño lista + detalle */
.split{display:grid;grid-template-columns:minmax(250px,330px) 1fr;gap:18px;align-items:start}
.list{display:grid;gap:8px}
.list-item{display:grid;gap:5px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.list-item:hover{border-color:var(--muted)}
.list-item[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.list-item .li-name{font-weight:600}
.list-item .li-meta{font-size:.82rem;color:var(--muted)}
.detail{display:grid;gap:16px}
.detail-head{display:grid;gap:6px}

/* Datos */
dl.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 18px;margin:0}
dl.facts div{display:grid;gap:1px;min-width:0}
dl.facts dt{font-size:.75rem;color:var(--muted);font-weight:500}
dl.facts dd{margin:0;overflow-wrap:anywhere}

/* Stepper */
.stepper{display:grid;grid-template-columns:repeat(7,1fr);gap:0;list-style:none;margin:0;padding:0}
.stepper li{position:relative;display:grid;justify-items:center;gap:4px;text-align:center;padding:0 2px;font-size:.78rem}
.stepper li::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.stepper li:first-child::before{display:none}
.stepper li.done::before,.stepper li.current::before{background:var(--accent)}
.stepper .dot{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-size:.72rem;font-weight:700;color:var(--muted)}
.stepper li.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper li.current .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.stepper .s-l{font-weight:600;line-height:1.2}
.stepper .s-d{color:var(--muted);font-size:.72rem}

/* Matriz */
.matrix-wrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
table.matrix{width:100%;border-collapse:collapse;font-size:.88rem;min-width:720px}
table.matrix th,table.matrix td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:middle}
table.matrix thead th{background:var(--surface-2);font-size:.78rem;font-weight:600;text-align:center;line-height:1.25}
table.matrix thead th small{display:block;font-weight:400;color:var(--muted);font-size:.72rem;margin-top:2px}
table.matrix tbody tr:last-child th,table.matrix tbody tr:last-child td{border-bottom:0}
table.matrix .crit-col{text-align:left;width:38%}
table.matrix .crit-col strong{display:block;font-weight:600}
table.matrix .crit-col small{display:block;color:var(--muted);font-weight:400;font-size:.8rem;line-height:1.35}
table.matrix .w-col{text-align:center;color:var(--muted);width:56px;font-variant-numeric:tabular-nums}
table.matrix td.lvl{text-align:center;width:13%}
table.matrix td.lvl.sel{background:var(--accent-soft)}
.lvl-pick{display:inline-grid;place-items:center;cursor:pointer;position:relative}
.lvl-pick input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.lvl-pick .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--muted);background:var(--surface)}
.lvl-pick:hover .dot{border-color:var(--accent)}
.lvl-pick input:checked + .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lvl-pick input:focus-visible + .dot{outline:2px solid var(--accent);outline-offset:2px}
.lvl-mark{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.8rem}
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:12px 14px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.score .big{font-family:var(--font-display);font-size:2rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.score .lbl{font-size:.82rem;color:var(--muted)}

/* Formularios */
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 16px;margin:0;display:grid;gap:12px}
legend{font-family:var(--font-display);font-weight:600;font-size:1rem;padding:0 6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 16px}
.field{display:grid;gap:4px;min-width:0}
.field label,.field .lab{font-size:.8rem;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical}
.field input[readonly]{background:var(--surface-2);color:var(--muted)}
.field.err input,.field.err select,.field.err textarea{border-color:var(--crit)}
.field .ferr{font-size:.78rem;color:var(--crit)}
.checks{display:grid;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:none}
.check.err{color:var(--crit)}
.radio-inline{display:flex;gap:16px;flex-wrap:wrap}
.radio-inline label{display:flex;gap:6px;align-items:center;font-size:.9rem;color:var(--ink)}
.radio-inline input{accent-color:var(--accent)}
.errbox{border:1px solid var(--crit);background:var(--crit-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:.9rem}
.errbox ul{margin:6px 0 0;padding-left:18px}

/* Archivos */
.drop{display:grid;justify-items:center;gap:6px;padding:20px;border:2px dashed var(--line);border-radius:var(--radius);text-align:center;background:var(--surface-2);cursor:pointer;position:relative}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop strong{color:var(--accent)}
.files{display:grid;gap:6px}
.file-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.file-row .f-ico{width:30px;height:36px;flex:none;border-radius:4px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--font-mono);font-size:.62rem;font-weight:700}
.file-row .f-main{flex:1 1 200px;min-width:0;display:grid}
.file-row .f-name{font-weight:500;overflow-wrap:anywhere}
.file-row .f-meta{font-size:.8rem;color:var(--muted)}

/* Columna lateral del estudiante */
.two{display:grid;grid-template-columns:1fr minmax(260px,330px);gap:18px;align-items:start}
.rules{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:.88rem}
.rules li b{display:block;font-weight:600}
.rules .ri{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:.75rem;font-weight:700;background:var(--warn-soft);color:var(--warn)}

/* Historial */
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0}
.timeline li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.86rem}
.timeline li:last-child{border-bottom:0}
.timeline .t-d{color:var(--muted);font-variant-numeric:tabular-nums}
.timeline .t-a{font-weight:600}

/* Cajón y diálogos */
.scrim{position:fixed;inset:0;background:rgba(10,18,26,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(860px,100%);background:var(--bg);z-index:41;display:grid;grid-template-rows:auto auto 1fr;box-shadow:var(--shadow);border-left:1px solid var(--line)}
.drawer-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 22px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.drawer-head .d-title{display:grid;gap:6px}
.drawer-actions{display:flex;flex-wrap:wrap;gap:8px;padding:10px 22px;background:var(--surface);border-bottom:1px solid var(--line)}
.drawer-actions:empty{padding:0;border:0}
.drawer-body{overflow:auto;padding:18px 22px 40px;display:grid;gap:16px;align-content:start}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:1.2rem;line-height:1;flex:none}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);z-index:61;padding:20px 22px;display:grid;gap:14px}
#modal-root .scrim{z-index:60}
.dialog.wide{width:min(780px,calc(100% - 32px))}
.login-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.login-grid .card{background:var(--surface-2)}
.accounts{display:grid;gap:6px;max-height:52vh;overflow:auto;padding-right:4px}
.accounts h4{margin:8px 0 2px;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.acct{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.acct:hover{border-color:var(--accent)}
.acct .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.8rem;flex:none}
.acct .a-n{font-weight:600;display:block}
.acct .a-m{font-size:.8rem;color:var(--muted)}
.perm{width:100%;border-collapse:collapse;font-size:.88rem}
.perm th,.perm td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
.perm th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2)}
.dlg-body{display:grid;gap:12px;font-size:.92rem}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.calc{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-variant-numeric:tabular-nums;font-size:.92rem}
.calc .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Configuración */
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.wtable{width:100%;border-collapse:collapse;font-size:.9rem}
.wtable th,.wtable td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.wtable th{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.wtable input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.wtable input[type="number"]{width:72px}
.sum-ok{color:var(--ok);font-weight:600}
.sum-bad{color:var(--crit);font-weight:600}

details.mx summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:.9rem}
details.mx[open] summary{margin-bottom:10px}

@media (max-width: 900px){
  .split,.two{grid-template-columns:1fr}
  .roles{margin-left:0}
}

'use strict';
/* ===================== Utilidades ===================== */
const UIKEY = 'practicas-icif-ui-v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const last = a => (a && a.length) ? a[a.length - 1] : null;
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const TODAY = iso(new Date());
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
function businessDaysBetween(a, b) { // días hábiles entre a y b, sin contar ninguno de los dos (no descuenta feriados)
  let n = 0; const d = parseD(a); const end = parseD(b); d.setDate(d.getDate() + 1);
  while (d < end) { const w = d.getDay(); if (w !== 0 && w !== 6) n++; d.setDate(d.getDate() + 1); }
  return n;
}
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sept','oct','nov','dic'];
const fmtD = s => { if (!s) return '—'; const d = parseD(s); return d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + d.getFullYear(); };
const fmtN = n => (n == null || isNaN(n)) ? '—' : n.toFixed(1).replace('.', ',');
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const redondear = x => Math.round(x * 10 + 1e-9) / 10;
const uid = () => Math.random().toString(36).slice(2, 10);

function rutDV(num) {
  const s = String(num); let sum = 0, m = 2;
  for (let i = s.length - 1; i >= 0; i--) { sum += Number(s[i]) * m; m = m === 7 ? 2 : m + 1; }
  const r = 11 - (sum % 11); return r === 11 ? '0' : r === 10 ? 'K' : String(r);
}
const rutFmt = num => String(num).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + rutDV(num);
function rutValido(str) {
  const c = String(str || '').replace(/[.\s]/g, '').toUpperCase();
  const m = c.match(/^(\d{7,8})-?([\dK])$/); return !!m && rutDV(m[1]) === m[2];
}
const emailValido = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s || '').trim());

/* Escala chilena 1,0–7,0 con exigencia configurable (por defecto 60 % para el 4,0) */
function notaDesde(criterios, niveles, exigenciaPct) {
  let tot = 0, got = 0;
  for (const c of criterios) {
    const n = niveles[c.id]; if (!n) return null;
    tot += Number(c.peso) || 0; got += (Number(c.peso) || 0) * n / 4;
  }
  if (!tot) return null;
  const p = got / tot, e = exigenciaPct / 100;
  const nota = p < e ? 1 + 3 * p / e : 4 + 3 * (p - e) / (1 - e);
  return redondear(Math.min(7, Math.max(1, nota)));
}
function notaFinal(p) {
  if (!p.evalEmpresa || !p.evalAcademico) return null;
  const w = state.config.ponderacion[p.tipo];
  return redondear(p.evalEmpresa.nota * w.empresa / 100 + p.evalAcademico.nota * w.academico / 100);
}

/* ===================== Etapas y alertas ===================== */
const ETAPAS = {
  busqueda:      { label: 'Buscando empresa',          tone: 'neutral', orden: -1, corto: 'Buscando empresa' },
  borrador:      { label: 'Formulario en preparación', tone: 'neutral', orden: 0, corto: 'Formulario' },
  solicitada:    { label: 'Activación solicitada',     tone: 'info',    orden: 1, corto: 'Por activar' },
  activada:      { label: 'Activada · seguro pendiente', tone: 'warn',  orden: 2, corto: 'Seguro pendiente' },
  lista:         { label: 'Lista para iniciar',        tone: 'accent',  orden: 3, corto: 'Por iniciar' },
  en_curso:      { label: 'En curso',                  tone: 'accent',  orden: 4, corto: 'En curso' },
  correcciones:  { label: 'Informe con observaciones', tone: 'warn',    orden: 5, corto: 'Observaciones' },
  en_evaluacion: { label: 'En evaluación',             tone: 'info',    orden: 6, corto: 'En evaluación' },
  por_cerrar:    { label: 'Lista para cierre',         tone: 'ok',      orden: 7, corto: 'Por cerrar' },
  cerrada:       { label: 'Cerrada',                   tone: 'ok',      orden: 8, corto: 'Cerradas' }
};
const devPendiente = p => { const d = last(p.devoluciones); return d && !d.resuelta ? d : null; };
function etapa(p) {
  if (p.cierre) return 'cerrada';
  if (!p.solicitud) return p.empresa.razon ? 'borrador' : 'busqueda';
  if (!p.activacion) return 'solicitada';
  if (!p.seguro) return 'activada';
  if (devPendiente(p)) return 'correcciones';
  if (!p.informes.length) return TODAY < p.inicio ? 'lista' : 'en_curso';
  if (p.evalEmpresa && p.evalAcademico) return 'por_cerrar';
  return 'en_evaluacion';
}
function alertas(p) {
  const a = []; const e = etapa(p);
  if (e === 'solicitada') {
    const bd = businessDaysBetween(p.solicitud.fecha, p.inicio);
    if (bd < 10) a.push({ sev: 'warn', txt: `Solicitada con ${bd} días hábiles de anticipación (mínimo 10).` });
    const [, m, d] = p.solicitud.fecha.split('-').map(Number);
    if ((m === 1 && d > 15) || m === 2) a.push({ sev: 'warn', txt: 'Solicitud enviada después del 15 de enero.' });
  }
  if ((e === 'solicitada' || e === 'activada') && p.inicio <= TODAY) {
    a.push({ sev: 'crit', txt: `Llegó la fecha de inicio (${fmtD(p.inicio)}) sin seguro emitido. No debe comenzar.` });
  } else if (e === 'activada') {
    const d = daysBetween(TODAY, p.inicio);
    if (d <= 7) a.push({ sev: 'warn', txt: `Seguro pendiente y la práctica inicia en ${d} día${d === 1 ? '' : 's'}.` });
  }
  if (p.seguro && !p.cierre) {
    if (p.termino < TODAY && !p.evalEmpresa) {
      const d = daysBetween(p.termino, TODAY);
      a.push({ sev: d > 30 ? 'crit' : 'warn', txt: `La empresa no ha evaluado (la práctica terminó hace ${d} días).` });
    }
    if (p.termino < TODAY && !p.informes.length) {
      const d = daysBetween(p.termino, TODAY);
      if (d > 14) a.push({ sev: 'warn', txt: `Informe no entregado (terminó hace ${d} días).` });
    }
    const inf = last(p.informes);
    if (inf && !p.evalAcademico && !devPendiente(p)) {
      const d = daysBetween(inf.fecha, TODAY);
      if (d > 10) a.push({ sev: 'warn', txt: `Informe sin evaluación académica hace ${d} días.` });
    }
  }
  if (e === 'por_cerrar') a.push({ sev: 'info', txt: 'Ambas evaluaciones registradas: lista para cierre.' });
  (p.cartas || []).filter(c => c.estado === 'solicitada').forEach(c => {
    const d = daysBetween(c.fechaSolicitud, TODAY);
    a.push({ sev: d > 3 ? 'warn' : 'info', txt: `Pidió una carta de presentación para ${c.empresa || 'uso general'} (${d === 0 ? 'hoy' : `hace ${d} día${d === 1 ? '' : 's'}`}).` });
  });
  return a;
}
const SEV_ORD = { crit: 0, warn: 1, info: 2 };
const enPreparacion = e => e === 'busqueda' || e === 'borrador';

function addDaysIso(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); }

/* ===================== Estado y conexión ===================== */
function loadUI() {
  const def = { role: 'director', person: { estudiante: '', empresa: '', academico: '' },
    dir: { tab: 'panel', q: '', tipo: '', etapa: '', acad: '' }, sel: { empresa: null, academico: null }, acaFiltro: 'pend', mxEdit: 'industrial.empresa' };
  try { const s = localStorage.getItem(UIKEY); if (s) { const o = JSON.parse(s); return Object.assign(def, o, { dir: Object.assign(def.dir, o.dir || {}), person: def.person, role: def.role }); } } catch (e) {}
  return def;
}
let state = null;

ui.dirSel = null; ui.formErrors = {}; ui.drafts = {}; ui.auth = { step: 'email', email: '' }; ui.cargaTxt = '';

const est = p => state.estudiantes.find(e => e.id === p.estudianteId) || { id: p.estudianteId, nombre: p.estudianteId, rut: '', malla: '2024', nivel: 0, correo: p.estudianteId, telefono: '' };
const acad = id => state.academicos.find(a => a.id === id);
const acadNombre = id => (acad(id) || {}).nombre || 'Sin asignar';
const practicaDe = email => { const ps = state.practicas.filter(p => p.estudianteId === email); return ps.find(p => !p.cierre) || ps[ps.length - 1] || null; };
const ROLE_MAP = { direccion: 'director', docente: 'academico', supervisor: 'empresa', estudiante: 'estudiante' };
const ROLE_LABEL = { direccion: 'Dirección de carrera', docente: 'Docente corrector/a', supervisor: 'Supervisor/a de empresa', estudiante: 'Estudiante' };

const CFG = window.APP_CONFIG || {};
const configurado = !!(CFG.supabaseUrl && CFG.supabaseKey && !/TU_PROYECTO|PEGA_AQUI/.test(CFG.supabaseUrl + CFG.supabaseKey));
const sb = (configurado && window.supabase) ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey,
  { auth: { flowType: 'implicit', detectSessionInUrl: true, persistSession: true, autoRefreshToken: true } }) : null;
let session = null, cargando = true, errorCarga = '';
const siteUrl = () => location.origin + location.pathname;

let reloadP = null;
function reload() {
  if (reloadP) return reloadP;
  reloadP = (async () => {
    const { data, error } = await sb.rpc('estado');
    cargando = false;
    if (error) { errorCarga = error.message || 'Error de conexión.'; state = null; }
    else {
      errorCarga = ''; state = data;
      if (state && state.yo) { ui.role = ROLE_MAP[state.yo.rol]; ui.person[ui.role] = state.yo.email; }
    }
    if (/access_token|error_description/.test(location.hash)) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
    render();
  })().finally(() => { reloadP = null; });
  return reloadP;
}
async function call(fn, args, okMsg) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) { toast(error.message || 'No se pudo completar la acción.'); return { ok: false }; }
  await reload();
  if (okMsg) toast(typeof okMsg === 'function' ? okMsg(data) : okMsg);
  return { ok: true, data };
}
async function enviarAcceso(email) {
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: siteUrl() } });
  return error ? (error.message || 'error desconocido') : null;
}

/* Guardado automático del formulario del estudiante */
let borradorPend = null, borradorPid = null, borradorT = null;
function deepMerge(a, b) { for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) a[k] = deepMerge(a[k] || {}, b[k]); else a[k] = b[k]; } return a; }

    right(xr, y, s, o = {}) { api.text(xr - textW(s, o.size || 11, o.bold), y, s, o); },
    center(xc, y, s, o = {}) { api.text(xc - textW(s, o.size || 11, o.bold) / 2, y, s, o); },
    line(x1, y1, x2, y2, wd = 0.5, gray = 0) { ops.push(`${gray} G ${wd} w ${x1} ${y1} m ${x2} ${y2} l S`); },

    `<< /Length ${content.length} >>\nstream\n${content}endstream`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];

  return bytes;
}

  const chip = c.estado === 'solicitada' ? '<span class="chip tone-info">Solicitada</span>' : c.estado === 'rechazada' ? '<span class="chip tone-crit">Rechazada</span>' : vencida ? '<span class="chip tone-neutral">Vencida</span>' : '<span class="chip tone-ok">Emitida</span>';
  const para = c.empresa ? esc(c.empresa) + (c.destinatario ? ` · ${esc(c.destinatario)}` : '') : 'Uso general (a quien corresponda)';
  const meta = c.estado === 'emitida' ? `N° <span class="mono">${esc(c.folio)}</span> · código <span class="mono">${esc(c.codigo)}</span> · emitida el ${fmtD(c.fechaEmision)} · válida hasta el ${fmtD(c.vence)}`
    : c.estado === 'rechazada' ? `Solicitada el ${fmtD(c.fechaSolicitud)} · ${esc(c.motivo || '')}` : `Solicitada el ${fmtD(c.fechaSolicitud)} · en revisión por la Dirección de Carrera`;
  let acc = '';
  if (c.estado === 'emitida') acc = `<button type="button" class="btn small" data-act="carta-dl" data-pid="${p.id}" data-cid="${c.id}">Descargar PDF</button>`;
  if (c.estado === 'solicitada' && who === 'director') acc = `<button type="button" class="btn small primary" data-act="carta-emit" data-pid="${p.id}" data-cid="${c.id}">Emitir</button><button type="button" class="btn small" data-act="carta-rech" data-pid="${p.id}" data-cid="${c.id}">Rechazar</button>`;
  const quien = who === 'director' ? `<span class="f-name">${esc(est(p).nombre)} <span class="tag">${TIPOS[p.tipo].corto}</span></span><span class="f-meta">Para: ${para}</span>` : `<span class="f-name">${para}</span>`;
  return `<div class="file-row"><span class="f-ico" aria-hidden="true">PDF</span><div class="f-main">${quien}<span class="f-meta">${meta}</span></div>${chip}<div class="btn-row">${acc}</div></div>`;
}
function cartasEstudiante(p, e, puedePedir) {
  const cs = (p.cartas || []).slice().reverse();
  const lista = cs.length ? `<div class="files">${cs.map(c => cartaRow(p, c, 'estudiante')).join('')}</div>` : '';
  const form = puedePedir ? `<form class="detail" data-form="carta" novalidate>
      <div class="fgrid">
        <div class="field"><label for="c-emp">Empresa u organización</label><input id="c-emp" placeholder="Déjalo vacío para una carta general"></div>
        <div class="field"><label for="c-dest">Dirigida a (opcional)</label><input id="c-dest" placeholder="Nombre de quien la recibe"></div>
        <div class="field"><label for="c-cargo">Cargo (opcional)</label><input id="c-cargo" placeholder="Ej. Jefe/a de TI"></div>
      </div>
      <label class="check"><input type="checkbox" id="c-req"> <span>Declaro que cumplo los requisitos de ${TIPOS[p.tipo].nombre} (${codigo(p)}): ${TIPOS[p.tipo].req[e.malla]}</span></label>
      <div class="btn-row"><button type="submit" class="btn primary">Solicitar carta</button></div>

    ${puedePedir ? `<p class="note">La emite la Dirección de Carrera con folio y código de verificación, y la descargas en PDF. Puedes pedir una por empresa; sin destinatario, va dirigida a quien corresponda.${state.config.carta.auto ? ' Se emite al instante.' : ''}</p>` : ''}

function todasLasCartas() {
  return state.practicas.flatMap(p => (p.cartas || []).map(c => ({ p, c })))
    .sort((a, b) => (a.c.estado === 'solicitada' ? 0 : 1) - (b.c.estado === 'solicitada' ? 0 : 1) || (b.c.fechaEmision || b.c.fechaSolicitud).localeCompare(a.c.fechaEmision || a.c.fechaSolicitud));
}
function renderCartas() {
  const box = $('#cartas-list'); if (!box) return;
  const q = (ui.cq || '').trim().toLowerCase();
  const rows = todasLasCartas().filter(({ p, c }) => !q || [est(p).nombre, c.empresa, c.folio, c.codigo].join(' ').toLowerCase().includes(q));
  box.innerHTML = rows.length ? `<div class="files">${rows.map(({ p, c }) => cartaRow(p, c, 'director')).join('')}</div>` : '<p class="empty">Ninguna carta coincide con la búsqueda.</p>';

function dirActions(p) {

  if (e === 'solicitada') { b.push('<button class="btn primary" data-act="approve">Aprobar activación</button>'); b.push('<button class="btn" data-act="return-req">Devolver solicitud</button>'); }
  if (e === 'activada') b.push('<button class="btn primary" data-act="seguro">Registrar seguro emitido</button>');
  if (e === 'por_cerrar') b.push('<button class="btn primary" data-act="close">Cerrar práctica y registrar nota</button>');
  if (e !== 'cerrada' && !enPreparacion(e)) b.push('<button class="btn" data-act="reassign">Cambiar docente corrector/a</button>');

}

/* ===================== Vista: Académico/a ===================== */
function viewAcademico() {
  const a = acad(ui.person.academico) || state.academicos[0];
  const mias = state.practicas.filter(p => p.academicoId === a.id && p.activacion);
  const porEvaluar = p => p.informes.length && !p.evalAcademico && !devPendiente(p);
  const lista = (ui.acaFiltro === 'pend' ? mias.filter(porEvaluar) : mias).sort((x, y) => ETAPAS[etapa(x)].orden - ETAPAS[etapa(y)].orden);
  let sel = byId(ui.sel.academico);
  if (!sel || sel.academicoId !== a.id) sel = lista[0] || mias[0] || null;
  const nPend = mias.filter(porEvaluar).length;
  const head = `<div class="page-head"><div><div class="eyebrow">Docente corrector/a de prácticas</div><h2>${esc(a.nombre)}</h2></div><p>${mias.length} práctica${mias.length === 1 ? '' : 's'} asignada${mias.length === 1 ? '' : 's'} · ${nPend} informe${nPend === 1 ? '' : 's'} por evaluar</p></div>`;
  const tabs = `<div class="tabs" role="tablist"><button role="tab" aria-selected="${ui.acaFiltro === 'pend'}" data-act="aca-f" data-f="pend">Por evaluar (${nPend})</button><button role="tab" aria-selected="${ui.acaFiltro === 'todas'}" data-act="aca-f" data-f="todas">Todas (${mias.length})</button></div>`;
  const items = lista.length ? lista.map(p => `<button type="button" class="list-item" data-act="sel" data-who="academico" data-pid="${p.id}" aria-current="${sel && sel.id === p.id}"><span class="li-name">${esc(est(p).nombre)}</span><span class="li-meta">${TIPOS[p.tipo].corto} · ${esc(p.empresa.razon)}</span><span class="chips">${chipEtapa(p)}</span></button>`).join('') : '<p class="empty">No tienes informes pendientes.</p>';

}
function detalleAcademico(p) {

/* ===================== Vista: Supervisor/a de empresa ===================== */
function supervisores() {
  const m = new Map();

  return [...m.values()];
}
function viewEmpresa() {
  const sups = supervisores();

  if (!s) return '<section class="card"><p class="empty">No hay supervisores con prácticas activadas.</p></section>';
  const mias = state.practicas.filter(p => p.activacion && p.supervisor.correo === s.correo).sort((a, b) => (a.evalEmpresa ? 1 : 0) - (b.evalEmpresa ? 1 : 0) || b.inicio.localeCompare(a.inicio));

function validarSolicitud(p, e) {
  const er = {};
  const req = (path, val, msg) => { if (!String(val ?? '').trim()) er[path] = msg; };
  req('e.rut', e.rut, 'Falta tu RUT.'); if (e.rut && !rutValido(e.rut)) er['e.rut'] = 'Tu RUT no es válido (revisa el dígito verificador).';
  req('e.correo', e.correo, 'Falta tu correo institucional.'); if (e.correo && !emailValido(e.correo)) er['e.correo'] = 'Tu correo no tiene un formato válido.';
  req('e.telefono', e.telefono, 'Falta tu teléfono.');
  if (e.malla === '2024' && Number(e.nivel) < TIPOS[p.tipo].nivelMin) er['e.nivel'] = `Para ${TIPOS[p.tipo].nombre} (malla 2024) necesitas el ${TIPOS[p.tipo].nivelMin}° nivel aprobado.`;
  req('p.nrc', p.nrc, 'Falta el NRC de la sección.');
  req('p.empresa.razon', p.empresa.razon, 'Falta la razón social de la empresa.');
  req('p.empresa.rut', p.empresa.rut, 'Falta el RUT de la empresa.'); if (p.empresa.rut && !rutValido(p.empresa.rut)) er['p.empresa.rut'] = 'El RUT de la empresa no es válido.';
  req('p.empresa.direccion', p.empresa.direccion, 'Falta la dirección de la empresa.');
  req('p.empresa.rep', p.empresa.rep, 'Falta el representante legal.');
  req('p.empresa.rutRep', p.empresa.rutRep, 'Falta el RUT del representante legal.'); if (p.empresa.rutRep && !rutValido(p.empresa.rutRep)) er['p.empresa.rutRep'] = 'El RUT del representante legal no es válido.';
  req('p.supervisor.nombre', p.supervisor.nombre, 'Falta el nombre del supervisor/a.');
  req('p.supervisor.cargo', p.supervisor.cargo, 'Falta el cargo del supervisor/a.');
  req('p.supervisor.correo', p.supervisor.correo, 'Falta el correo del supervisor/a.'); if (p.supervisor.correo && !emailValido(p.supervisor.correo)) er['p.supervisor.correo'] = 'El correo del supervisor/a no tiene un formato válido.';
  req('p.supervisor.telefono', p.supervisor.telefono, 'Falta el teléfono del supervisor/a.');
  req('p.inicio', p.inicio, 'Falta la fecha de inicio.'); req('p.termino', p.termino, 'Falta la fecha de término.');
  if (p.inicio && p.inicio <= TODAY) er['p.inicio'] = 'La fecha de inicio debe ser posterior a hoy.';
  if (p.inicio && p.termino && p.termino <= p.inicio) er['p.termino'] = 'La fecha de término debe ser posterior al inicio.';
  req('p.academicoId', p.academicoId, 'Elige al docente a cargo.');
  const ckm = { inscrita: 'Confirma que tienes inscrita la asignatura.', requisitos: 'Confirma que cumples los requisitos.', cupo: 'Confirma el cupo con la empresa.', noConsecutiva: 'Confirma que no es una práctica consecutiva.' };
  for (const k in ckm) if (!p.checklist[k]) er['ck.' + k] = ckm[k];
  return er;
}
function setBind(path, value, p, e) {
  if (path.startsWith('ck.')) { p.checklist[path.slice(3)] = value; return; }
  const [root, ...rest] = path.split('.');
  let o = root === 'e' ? e : p;
  for (let i = 0; i < rest.length - 1; i++) o = o[rest[i]];
  const k = rest[rest.length - 1];
  o[k] = (k === 'nivel') ? Number(value) : value;
}

function parseCarga(txt) {
  const filas = [], errores = [];
  String(txt || '').split(/\r?\n/).forEach((line, i) => {
    if (!line.trim()) return;
    if (i === 0 && /correo|email/i.test(line)) return;
    const [nombre = '', email = '', rut = '', malla = '', nivel = '', practica = '', periodo = ''] = line.split(/\t|;/).map(x => x.trim());
    const err = [];
    if (!emailValido(email)) err.push('correo no válido');
    if (!['2019', '2024'].includes(malla)) err.push('la malla debe ser 2019 o 2024');
    const tp = /industrial|g00[17]/i.test(practica) ? 'industrial' : /profesional|i00[16]/i.test(practica) ? 'profesional' : '';
    if (!tp) err.push('la práctica debe ser industrial o profesional (o su código)');
    if (rut && !rutValido(rut)) err.push('RUT no válido');
    if (err.length) errores.push(`Línea ${i + 1}: ${err.join(', ')}.`);
    else filas.push({ email: email.toLowerCase(), nombre, rol: 'estudiante', rut, malla, nivel: Number(nivel) || 0, tipo: tp, periodo });
  });
  return { filas, errores };
}

}

  seguro: () => {
    const p = byId(ui.dirSel);
    openDialog({ title: 'Registrar seguro de práctica', okLabel: 'Registrar seguro',
      body: `<div class="fgrid"><div class="field"><label for="d-sf">Fecha de emisión</label><input id="d-sf" type="date" value="${TODAY}"></div><div class="field"><label for="d-folio">Folio o N° de póliza</label><input id="d-folio" placeholder="Opcional"></div></div><p class="note">Con el seguro registrado, ${esc(p.supervisor.nombre)} podrá evaluar y ${esc(est(p).nombre)} podrá subir su informe.</p>`,
      onOk: async () => { const r = await call('registrar_seguro', { p_id: p.id, p_fecha: $('#d-sf').value || TODAY, p_folio: $('#d-folio').value.trim() }, 'Seguro registrado.'); return r.ok ? undefined : false; } });

  close: () => {
    const p = byId(ui.dirSel); const nf = notaFinal(p);
    openDialog({ title: 'Cerrar práctica', okLabel: `Cerrar con nota ${fmtN(nf)}`, body: `${notaFinalBlock(p)}<p class="note">Al cerrar, el estudiante verá sus notas y la nota queda lista para el acta. Las evaluaciones ya no se podrán modificar.</p>`,
      onOk: async () => { const r = await call('cerrar_practica', { p_id: p.id }, n => `Práctica cerrada con nota ${fmtN(Number(n))}.`); return r.ok ? undefined : false; } });

  reassign: () => {
    const p = byId(ui.dirSel);
    openDialog({ title: 'Cambiar docente corrector/a', okLabel: 'Guardar', body: `<div class="field"><label for="d-aca2">Docente</label><select id="d-aca2">${docenteOpts(p.academicoId)}</select></div>`,
      onOk: async () => { const v = $('#d-aca2').value; if (v === p.academicoId) return; const r = await call('cambiar_docente', { p_id: p.id, p_docente: v }, 'Docente actualizado.'); return r.ok ? undefined : false; } });
  },
  'del-practica': () => {
    const p = byId(ui.dirSel);
    openDialog({ title: 'Eliminar práctica', okLabel: 'Eliminar', danger: true, body: `<p>Se eliminará la práctica de ${esc(est(p).nombre)} (${TIPOS[p.tipo].nombre}) con sus cartas e historial. No se puede deshacer.</p>`,
      onOk: async () => { const r = await call('eliminar_practica', { p_id: p.id }, 'Práctica eliminada.'); if (!r.ok) return false; ui.dirSel = null; renderDrawer(); } });
  },
  'resend-access': async () => {
    const p = byId(ui.dirSel);
    const r = await call('reenviar_acceso', { p_id: p.id }); if (!r.ok) return;
    const err = await enviarAcceso(r.data);
    toast(err ? `No se pudo enviar el acceso a ${r.data}: ${err}` : `Se envió el enlace de acceso a ${r.data}.`);
  },
  sel: el => { ui.sel[el.dataset.who] = el.dataset.pid; render(); if (window.innerWidth < 900) $('.detail')?.scrollIntoView({ block: 'start' }); },
  'aca-f': el => { ui.acaFiltro = el.dataset.f; render(); },
  dl: el => downloadDoc(byId(el.dataset.pid), el.dataset.kind, Number(el.dataset.i)),
  'save-draft': async () => { if (await flushBorrador()) toast('Borrador guardado.'); },
  'emp-send': el => {
    const p = byId(el.dataset.pid); const key = 'emp:' + p.id; const d = ui.drafts[key];
    const crit = state.config.matrices[p.tipo].empresa; const falt = crit.filter(c => !d.niveles[c.id]);
    if (falt.length) { toast(`Falta evaluar ${falt.length} criterio${falt.length > 1 ? 's' : ''}: ${falt[0].nombre}${falt.length > 1 ? '…' : ''}`); document.querySelector(`[data-row="${falt[0].id}"]`)?.scrollIntoView({ block: 'center' }); return; }
    if (!d.fortalezas.trim()) { toast('Escribe al menos las fortalezas observadas.'); $('#emp-f')?.focus(); return; }
    const nota = notaDesde(crit, d.niveles, state.config.exigencia);
    openDialog({ title: 'Enviar evaluación', okLabel: 'Enviar evaluación', body: `<div class="score"><span class="big">${fmtN(nota)}</span><span class="lbl">Nota de la evaluación de ${esc(est(p).nombre)}</span></div><p>Una vez enviada no podrás modificarla. La carrera y el docente corrector la verán de inmediato.</p>`,
      onOk: async () => { const r = await call('evaluar_empresa', { p_id: p.id, p_niveles: d.niveles, p_extras: { fortalezas: d.fortalezas.trim(), mejoras: d.mejoras.trim(), recibiria: d.recibiria } }, 'Evaluación enviada. ¡Gracias!');
        if (!r.ok) return false; delete ui.drafts[key]; } });
  },
  'aca-send': el => {
    const p = byId(el.dataset.pid); const key = 'aca:' + p.id; const d = ui.drafts[key];
    const crit = state.config.matrices[p.tipo].academico; const falt = crit.filter(c => !d.niveles[c.id]);
    if (falt.length) { toast(`Falta evaluar ${falt.length} criterio${falt.length > 1 ? 's' : ''}: ${falt[0].nombre}${falt.length > 1 ? '…' : ''}`); document.querySelector(`[data-row="${falt[0].id}"]`)?.scrollIntoView({ block: 'center' }); return; }
    if (!d.comentario.trim()) { toast('Escribe una retroalimentación para el estudiante.'); $('#aca-com')?.focus(); return; }
    const nota = notaDesde(crit, d.niveles, state.config.exigencia);
    openDialog({ title: 'Registrar evaluación del informe', okLabel: 'Registrar', body: `<div class="score"><span class="big">${fmtN(nota)}</span><span class="lbl">Informe versión ${last(p.informes).version} · ${esc(est(p).nombre)}</span></div><p>El estudiante verá tu retroalimentación. La nota final se publica cuando la Dirección de Carrera cierre la práctica.</p>`,
      onOk: async () => { const r = await call('evaluar_academico', { p_id: p.id, p_niveles: d.niveles, p_comentario: d.comentario.trim() }, 'Evaluación registrada.');
        if (!r.ok) return false; delete ui.drafts[key]; } });
  },
  'aca-return': el => {
    const p = byId(el.dataset.pid); const key = 'aca:' + p.id; const d = ui.drafts[key];
    if (!d.comentario.trim()) { toast('Escribe en la retroalimentación qué debe corregir.'); $('#aca-com')?.focus(); return; }
    openDialog({ title: 'Devolver informe con observaciones', okLabel: 'Devolver', body: `<p>El estudiante recibirá estas observaciones y deberá subir una nueva versión:</p><div class="callout tone-warn"><p>${esc(d.comentario.trim())}</p></div>`,
      onOk: async () => { const r = await call('devolver_informe', { p_id: p.id, p_texto: d.comentario.trim() }, 'Informe devuelto al estudiante.'); if (!r.ok) return false; d.comentario = ''; render(); } });
  },
  'mx-add': () => { const [t, r] = ui.mxEdit.split('.'); state.config.matrices[t][r].push({ id: 'c' + uid(), nombre: 'Nuevo criterio', desc: '', peso: 0 }); render(); queueConfig(); },
  'mx-del': el => { const [t, r] = ui.mxEdit.split('.'); const arr = state.config.matrices[t][r]; if (arr.length < 2) return; arr.splice(Number(el.dataset.i), 1); render(); queueConfig(); },
  'carta-dl': el => { const p = byId(el.dataset.pid); const c = p.cartas.find(x => x.id === el.dataset.cid); offerFile(nombreArchivoCarta(p, c), cartaPdf(p, c)); },
  'carta-emit': el => {
    const p = byId(el.dataset.pid); const c = p.cartas.find(x => x.id === el.dataset.cid);
    openDialog({ title: 'Emitir carta de presentación', okLabel: 'Emitir carta',
      body: `<p>${esc(est(p).nombre)} · ${TIPOS[p.tipo].nombre} (${codigo(p)}), malla ${est(p).malla}, ${est(p).nivel}° nivel aprobado.</p>
        <dl class="facts"><div><dt>Empresa</dt><dd>${esc(c.empresa) || 'Uso general'}</dd></div><div><dt>Dirigida a</dt><dd>${esc(c.destinatario) || 'A quien corresponda'}${c.cargo ? ' · ' + esc(c.cargo) : ''}</dd></div><div><dt>Vigencia</dt><dd>${state.config.carta.vigencia} días</dd></div></dl>
        ${!state.config.carta.firmante ? '<div class="callout tone-warn"><p>La carta saldrá sin nombre en la firma. Puedes agregarlo en Configuración.</p></div>' : ''}`,
      onOk: async () => { const r = await call('emitir_carta', { p_carta: c.id }, 'Carta emitida.'); return r.ok ? undefined : false; } });
  },
  'carta-rech': el => {
    const c0 = byId(el.dataset.pid).cartas.find(x => x.id === el.dataset.cid);
    openDialog({ title: 'Rechazar solicitud de carta', okLabel: 'Rechazar', danger: true, body: `<div class="field"><label for="d-cm">Motivo (lo verá el estudiante)</label><textarea id="d-cm" placeholder="Ej.: aún no cumples el requisito de nivel aprobado."></textarea></div>`,
      onOk: async () => { const t = $('#d-cm').value.trim(); if (!t) { toast('Escribe el motivo.'); $('#d-cm').focus(); return false; }
        const r = await call('rechazar_carta', { p_carta: c0.id, p_motivo: t }, 'Solicitud rechazada.'); return r.ok ? undefined : false; } });
  },
  'carta-new': () => {
    const p = byId(ui.dirSel);
    openDialog({ title: 'Emitir carta de presentación', okLabel: 'Emitir carta',
      body: `<p>Para ${esc(est(p).nombre)} · ${TIPOS[p.tipo].nombre} (${codigo(p)}).</p><div class="fgrid">
        <div class="field"><label for="d-cemp">Empresa</label><input id="d-cemp" placeholder="Vacío = carta general"></div>
        <div class="field"><label for="d-cdest">Dirigida a</label><input id="d-cdest" placeholder="Opcional"></div>
        <div class="field"><label for="d-ccar">Cargo</label><input id="d-ccar" placeholder="Opcional"></div></div>`,
      onOk: async () => { const r = await call('nueva_carta', { p_id: p.id, p_empresa: $('#d-cemp').value.trim(), p_destinatario: $('#d-cdest').value.trim(), p_cargo: $('#d-ccar').value.trim() }, 'Carta emitida.'); return r.ok ? undefined : false; } });
  },
  'carta-preview': () => {
    const p = state.practicas[0];
    if (!p) { toast('Carga al menos un estudiante para ver la carta de ejemplo.'); return; }
    const c = { empresa: 'Empresa de ejemplo SpA', destinatario: 'Nombre Apellido', cargo: 'Jefe/a de TI', fechaEmision: TODAY, vence: addDaysIso(TODAY, Number(state.config.carta.vigencia) || 60), folio: 'ICIF-PAP-EJEMPLO', codigo: 'XXXX-XXXX' };
    offerFile('Carta_presentacion_ejemplo.pdf', cartaPdf(p, c));
  },
  'carga-enviar': async () => {
    const { filas, errores } = parseCarga(ui.cargaTxt); if (!filas.length || errores.length) return;
    const r = await call('agregar_personas', { p_lista: filas }, d => `${d.personas} estudiante${d.personas === 1 ? '' : 's'} cargado${d.personas === 1 ? '' : 's'} · ${d.practicas} práctica${d.practicas === 1 ? '' : 's'} nueva${d.practicas === 1 ? '' : 's'}.`);
    if (r.ok) { ui.cargaTxt = ''; render(); }
  },
  'dlg-cancel': () => closeDialog(),
  'dlg-ok': async el => {
    const fn = dlgOk; if (!fn) { closeDialog(); return; }
    el.disabled = true; let r;
    try { r = await fn(); } finally { el.disabled = false; }
    if (r === false) return; closeDialog();
  }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'TR' && ev.target.closest('button')) return;
  const fn = acts[el.dataset.act]; if (fn) { ev.preventDefault(); fn(el); }
});
document.addEventListener('submit', async ev => {
  const form = ev.target; ev.preventDefault();
  const kind = form.dataset.form;
  if (kind === 'auth-email') {
    const email = $('#au-mail').value.trim().toLowerCase();
    if (!emailValido(email)) { toast('Escribe un correo válido.'); return; }
    const btn = form.querySelector('button[type="submit"]'); btn.disabled = true;
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: siteUrl() } });
    btn.disabled = false;
    if (error) { toast('No pudimos enviar el correo: ' + (error.message || '')); return; }
    ui.auth = { step: 'code', email }; render(); $('#au-code')?.focus(); return;
  }
  if (kind === 'auth-code') {
    const token = $('#au-code').value.trim();
    if (!/^\d{6,10}$/.test(token)) { toast('Escribe el código que llegó a tu correo.'); return; }
    const { error } = await sb.auth.verifyOtp({ email: ui.auth.email, token, type: 'email' });
    if (error) { toast('El código no es válido o ya venció. Pide uno nuevo.'); return; }
    return; // onAuthStateChange carga los datos
  }
  if (kind === 'equipo') {
    const nombre = $('#eq-n').value.trim(), email = $('#eq-m').value.trim().toLowerCase(), rol = $('#eq-r').value;
    if (!nombre || !emailValido(email)) { toast('Escribe nombre y correo válidos.'); return; }
    await call('agregar_personas', { p_lista: [{ email, nombre, rol }] }, `${nombre} agregado/a al equipo.`); return;
  }
  if (kind === 'carta') {
    const p = practicaDe(state.yo.email); const e = est(p);
    if (e.malla === '2024' && Number(e.nivel) < TIPOS[p.tipo].nivelMin) { toast(`Para pedir la carta necesitas el ${TIPOS[p.tipo].nivelMin}° nivel aprobado.`); return; }
    if (!$('#c-req').checked) { toast('Debes declarar que cumples los requisitos.'); $('#c-req').focus(); return; }
    await call('pedir_carta', { p_id: p.id, p_empresa: $('#c-emp').value.trim(), p_destinatario: $('#c-dest').value.trim(), p_cargo: $('#c-cargo').value.trim() },
      d => d.estado === 'emitida' ? `Carta N° ${d.folio} emitida. Ya puedes descargarla.` : 'Solicitud enviada. La Dirección de Carrera emitirá tu carta.');
    return;
  }
  if (kind === 'solicitud') {
    const p = practicaDe(state.yo.email); const e = est(p);
    ui.formErrors = validarSolicitud(p, e);
    if (Object.keys(ui.formErrors).length) { render(); $('.errbox')?.scrollIntoView({ block: 'center' }); return; }
    if (!(await flushBorrador())) return;
    const bd = businessDaysBetween(TODAY, p.inicio);
    const [, m, d] = TODAY.split('-').map(Number); const tarde = (m === 1 && d > 15) || m === 2;
    openDialog({ title: 'Enviar solicitud de activación', okLabel: 'Enviar solicitud',
      body: `<p>Se enviará a la Dirección de Carrera tu solicitud para <b>${TIPOS[p.tipo].nombre}</b> (${codigo(p)}, NRC ${esc(p.nrc)}) en <b>${esc(p.empresa.razon)}</b>, del ${fmtD(p.inicio)} al ${fmtD(p.termino)}.</p>
        ${bd < 10 ? `<div class="callout tone-warn"><p>Faltan ${bd} días hábiles para el inicio. El proceso pide al menos 10; la activación podría no alcanzar a estar lista.</p></div>` : ''}
        ${tarde ? '<div class="callout tone-warn"><p>Ya pasó el 15 de enero, fecha límite para solicitar prácticas de verano.</p></div>' : ''}`,
      onOk: async () => { const r = await call('enviar_solicitud', { p_id: p.id }, 'Solicitud enviada a la Dirección de Carrera.'); if (!r.ok) return false; ui.formErrors = {}; } });
  }
});
function bindTarget() { const e = state.estudiantes.find(x => x.id === state.yo.email); const p = practicaDe(state.yo.email); return { e, p }; }
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.filter) { ui.dir[t.dataset.filter] = t.value; if (t.dataset.filter === 'q') { renderDirTable(); saveUI(); } return; }
  if (t.dataset.cfilter !== undefined) { ui.cq = t.value; renderCartas(); return; }
  if (t.dataset.carga !== undefined) { ui.cargaTxt = t.value; renderCargaPreview(); return; }
  if (t.dataset.cfgc && t.type !== 'checkbox') { const k = t.dataset.cfgc; state.config.carta[k] = k === 'vigencia' ? (Number(t.value) || 60) : t.value; queueConfig(); return; }
  if (t.dataset.bind && t.type !== 'checkbox' && t.tagName !== 'SELECT') {
    const { e, p } = bindTarget(); setBind(t.dataset.bind, t.value, p, e);
    queueBorrador(p.id, pathToPatch(t.dataset.bind, t.value));
    if (ui.formErrors[t.dataset.bind]) { delete ui.formErrors[t.dataset.bind]; t.closest('.field')?.classList.remove('err'); }
    return;
  }
  if (t.dataset.draft && t.tagName === 'TEXTAREA') { ui.drafts[t.dataset.draft][t.dataset.k] = t.value; return; }
  if (t.dataset.cfgm !== undefined) {
    const [tp, r] = ui.mxEdit.split('.'); const c = state.config.matrices[tp][r][Number(t.dataset.cfgm)];
    c[t.dataset.f] = t.dataset.f === 'peso' ? Number(t.value) || 0 : t.value; queueConfig();
    const sum = state.config.matrices[tp][r].reduce((s, x) => s + (Number(x.peso) || 0), 0); const el = $('#mx-sum');
    if (el) { el.textContent = `Suma de pesos: ${sum}%${sum === 100 ? '' : ' (debe sumar 100%)'}`; el.className = sum === 100 ? 'sum-ok' : 'sum-bad'; }
    const pv = $('#mx-preview'); if (pv) pv.innerHTML = matrizHTML(state.config.matrices[tp][r], {});
    return;
  }
  if (t.dataset.cfgw) {
    const v = Math.max(0, Math.min(100, Number(t.value) || 0)); const w = state.config.ponderacion[t.dataset.cfgw]; w.empresa = v; w.academico = 100 - v;
    const other = $(`#w-${t.dataset.cfgw}-a`); if (other) other.value = w.academico; queueConfig(); return;
  }
  if (t.dataset.cfgx !== undefined) { const v = Number(t.value); if (v >= 50 && v <= 70) { state.config.exigencia = v; queueConfig(); } return; }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.filter && t.tagName === 'SELECT') { ui.dir[t.dataset.filter] = t.value; render(); return; }
  if (t.dataset.actChange === 'mx-sel') { ui.mxEdit = t.value; render(); return; }
  if (t.dataset.mx) {
    const key = t.dataset.mx; ui.drafts[key].niveles[t.dataset.cid] = Number(t.value);
    const row = t.closest('tr'); row.querySelectorAll('td.lvl').forEach(td => td.classList.toggle('sel', td.contains(t)));
    updateMatrixPreview(key); return;
  }
  if (t.dataset.draft && t.type === 'radio') { ui.drafts[t.dataset.draft][t.dataset.k] = t.value; return; }
  if (t.dataset.bind && (t.type === 'checkbox' || t.tagName === 'SELECT')) {
    const { e, p } = bindTarget(); const v = t.type === 'checkbox' ? t.checked : t.value;
    setBind(t.dataset.bind, v, p, e); queueBorrador(p.id, pathToPatch(t.dataset.bind, v));
    if (ui.formErrors[t.dataset.bind]) delete ui.formErrors[t.dataset.bind];
    if (t.hasAttribute('data-rerender') || t.type === 'checkbox') render();
    return;
  }
  if (t.dataset.upload) { handleUpload(t.dataset.upload, t.dataset.pid, t.files && t.files[0]); t.value = ''; return; }
  if (t.dataset.cfgc && t.type === 'checkbox') { state.config.carta[t.dataset.cfgc] = t.checked; queueConfig(); return; }
});
['dragover', 'dragenter'].forEach(n => document.addEventListener(n, ev => { const z = ev.target.closest?.('.drop'); if (z) { ev.preventDefault(); z.classList.add('over'); } }));
['dragleave', 'drop'].forEach(n => document.addEventListener(n, ev => { const z = ev.target.closest?.('.drop'); if (z) z.classList.remove('over'); }));
document.addEventListener('drop', ev => {
  const z = ev.target.closest?.('.drop'); if (!z) return; ev.preventDefault();
  const f = ev.dataTransfer?.files?.[0]; if (f) handleUpload(z.dataset.drop, z.dataset.pid, f);
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if ($('#modal-root').innerHTML) { closeDialog(); return; }
  if (ui.dirSel) { ui.dirSel = null; renderDrawer(); }
});
window.addEventListener('beforeunload', () => { if (borradorPend) flushBorrador(); });

(async function init() {
  if (!sb) { cargando = false; render(); return; }
  render();
  sb.auth.onAuthStateChange((evento, s) => {
    const antes = session; session = s;
    if (!s) { if (antes) { state = null; render(); } return; }
    if ((evento === 'SIGNED_IN' || evento === 'INITIAL_SESSION') && (!antes || !state)) { cargando = true; render(); reload(); }
  });
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (session) { if (!state && !reloadP) reload(); } else { cargando = false; render(); }
})();

</script>
